# Coderift Technologies — Docker Compose
# Services:
#   - mcp_server: MCP HTTP transport on port 8000
#   - admin_platform: Admin UI + API on port 8001
#   - Both share the same SQLite database volume
#
# Usage:
#   docker-compose up --build
#   Then open http://localhost:8001 for the admin platform
#   and http://localhost:8000/health for the MCP server health check.

version: "3.9"

services:
  db_init:
    build: .
    volumes:
      - db_data:/app/db
    command: sh -c "python db/init_db.py && python db/apply_migration.py"

  mcp_server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/db
    command: python -m mcp_server.server_http --host 0.0.0.0 --port 8000
    depends_on:
      db_init:
        condition: service_completed_successfully

  admin_platform:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - db_data:/app/db
    command: python -m admin_platform.admin_tools_api
    depends_on:
      db_init:
        condition: service_completed_successfully
      mcp_server:
        condition: service_started

  user_platform:
    build: .
    ports:
      - "8010:8010"
    volumes:
      - db_data:/app/db
    command: python -m user_platform.backend --host 0.0.0.0 --port 8010
    depends_on:
      db_init:
        condition: service_completed_successfully
      mcp_server:
        condition: service_started

volumes:
  db_data: